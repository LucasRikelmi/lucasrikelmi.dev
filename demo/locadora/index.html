<!doctype html>
<html lang="pt-BR">
<head>
    <script src="mock-api.js"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <meta name="description" content="Demo do sistema de locadora de veículos: front-end com a API Spring simulada no navegador, incluindo o teste de concorrência.">

    <meta property="og:type" content="website">

    <meta property="og:locale" content="pt_BR">
    <meta property="og:url" content="https://lucasrikelmi.dev/demo/locadora/">
    <meta property="og:title" content="Locadora (demo) | Lucas Rikelmi">
    <meta property="og:description" content="Demo do sistema de locadora de veículos: front-end com a API Spring simulada no navegador, incluindo o teste de concorrência.">
    <meta property="og:image" content="https://lucasrikelmi.dev/assets/img/og.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Lucas Rikelmi, desenvolvedor: Software que resolve operação.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Locadora (demo) | Lucas Rikelmi">
    <meta name="twitter:description" content="Demo do sistema de locadora de veículos: front-end com a API Spring simulada no navegador, incluindo o teste de concorrência.">
    <meta name="twitter:image" content="https://lucasrikelmi.dev/assets/img/og.png">
    <link rel="stylesheet" href="global.css">
    <style>
        .dashboard-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px;
        }
        .card {
            background: var(--card-bg); padding: 20px; border-radius: 12px;
            border: 1px solid var(--glass); display: flex; flex-direction: column;
            justify-content: space-between; height: 120px;
        }
        .card h3 { margin: 0; font-size: 14px; color: var(--muted); text-transform: uppercase; }
        .card .value { font-size: 32px; font-weight: 700; color: var(--text); margin-top: 10px; }
        .card.accent { border-left: 4px solid var(--accent); }
        .card.success { border-left: 4px solid var(--success); }
        .card.warning { border-left: 4px solid var(--warning); }
        .card.danger { border-left: 4px solid var(--danger); }
    </style>
</head>
<body>

<div class="app">
    <aside class="sidebar">
        <div class="brand">
            <div class="logo">LV</div>
            <div>
                <h1>Locação Veículos</h1>
                <div style="font-size:12px; color:var(--muted)">Gestão de Frota</div>
            </div>
        </div>
        <nav>
            <a class="nav-item active" href="index.html">Dashboard</a>
            <a class="nav-item" href="frota.html">Marcas, Modelos & Categ.</a>
            <a class="nav-item" href="frota.html?tab=veiculo">Veículos</a>
            <a class="nav-item" href="locacao.html">Locações</a>
            <a class="nav-item" href="contrato.html">Contratos</a>
            <a class="nav-item" href="cliente.html">Clientes</a>
            <a class="nav-item" href="usuario.html">Usuários</a>
            <a class="nav-item" href="relatorios.html">Relatórios</a>
        </nav>
        <div style="margin-top:auto; padding-top:20px; border-top:1px solid var(--glass); display:flex; justify-content:space-between; align-items:center">
            <span style="font-size:12px; color:var(--muted)" id="user-display">Usuário</span>

            <button id="themeToggle" class="icon-btn" title="Alternar Tema">
                <svg class="icon-sun" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                <svg class="icon-moon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>
        </div>
    </aside>

    <main class="main">
        <div class="topbar">
            <h2>Visão Geral</h2>
            <button class="btn ghost" onclick="fazerLogout()" style="font-size:12px;">Sair</button>
        </div>

        <div class="dashboard-grid">
            <div class="card accent">
                <h3>Frota Total</h3>
                <div class="value" id="dash-total">0</div>
            </div>
            <div class="card warning">
                <h3>Em Locação</h3>
                <div class="value" id="dash-alugados">0</div>
            </div>
            <div class="card danger">
                <h3>Em Manutenção</h3>
                <div class="value" id="dash-manutencao">0</div>
            </div>
            <div class="card success">
                <h3>Receita (Contratos)</h3>
                <div class="value" id="dash-receita">R$ 0,00</div>
            </div>
        </div>

        <div class="panel">
            <h3>Últimos Veículos Adicionados</h3>
            <table id="tabela-recentes">
                <thead><tr><th>Modelo</th><th>Placa</th><th>Status</th></tr></thead>
                <tbody><tr><td colspan="3">Carregando...</td></tr></tbody>
            </table>
        </div>
    </main>
</div>

<script>
    const API_URL = 'http://localhost:8080';

    // --- 1. SEGURANÇA E LOGOUT ---

    // Verifica se existe usuário logado. Se não, manda pro login.
    const usuarioLogado = JSON.parse(localStorage.getItem('usuarioLogado'));
    if (!usuarioLogado) {
        window.location.href = 'login.html';
    } else {
        // Mostra o nome do usuário na sidebar
        const nomeExibicao = usuarioLogado.nome ? usuarioLogado.nome.split(' ')[0] : 'Usuário';
        document.getElementById('user-display').innerText = nomeExibicao;
    }

    function fazerLogout() {
        if(confirm("Tem certeza que deseja sair do sistema?")) {
            localStorage.removeItem('usuarioLogado');
            window.location.href = 'login.html';
        }
    }

    // --- 2. LÓGICA DO DASHBOARD ---

    async function carregarDashboard() {
        try {
            // Busca dados em paralelo (mais rápido)
            const [resVeiculos, resContratos] = await Promise.all([
                fetch(`${API_URL}/veiculos`),
                fetch(`${API_URL}/contratos`)
            ]);

            const veiculos = await resVeiculos.json();
            const contratos = await resContratos.json();

            // --- CÁLCULOS DE FROTA ---
            const total = veiculos.length;
            const alugados = veiculos.filter(v => v.status === 'ALUGADO' || v.status === 'INDISPONIVEL').length;
            const manutencao = veiculos.filter(v => v.status === 'MANUTENCAO').length;

            document.getElementById('dash-total').innerText = total;
            document.getElementById('dash-alugados').innerText = alugados;
            document.getElementById('dash-manutencao').innerText = manutencao;

            // --- CÁLCULO DE RECEITA ---
            let receitaTotal = 0;
            contratos.forEach(c => {
                if (c.valorTotal && c.valorTotal > 0) {
                    // Contrato fechado ou com valor definido
                    receitaTotal += c.valorTotal;
                } else if (c.listaLocacao) {
                    // Contrato aberto: soma o valor previsto das locações
                    c.listaLocacao.forEach(l => receitaTotal += (l.valorLocacao || 0));
                }
            });

            document.getElementById('dash-receita').innerText = receitaTotal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            // --- TABELA RECENTES ---
            const tbody = document.querySelector('#tabela-recentes tbody');
            tbody.innerHTML = '';
            // Pega os últimos 5 veículos
            const recentes = veiculos.slice(-5).reverse();

            recentes.forEach(v => {
                let statusClass = v.status === 'DISPONIVEL' ? 'available' : 'ocupado';
                tbody.innerHTML += `
                    <tr>
                        <td>${v.modelo?.nome || '-'}</td>
                        <td>${v.placa}</td>
                        <td><span class="status ${statusClass}">${v.status}</span></td>
                    </tr>
                `;
            });

        } catch (error) {
            console.error("Erro ao carregar dashboard:", error);
        }
    }

    document.getElementById('themeToggle').addEventListener('click', () => {
        document.body.classList.toggle('light');
    });

    // Inicia
    carregarDashboard();
</script>
</body>
</html>
