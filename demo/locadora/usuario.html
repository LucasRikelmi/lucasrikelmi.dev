<!doctype html>
<html lang="pt-BR">
<head>
    <script src="mock-api.js"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Gestão de Pessoas — Usuários</title>
    <meta name="robots" content="noindex, follow">
    <link rel="stylesheet" href="global.css">
    <style>
        /* Correção para garantir que o input no tema escuro funcione */
        #view-usuario input:not([type="hidden"]),
        #view-usuario select {
            color: inherit;
        }
        /* Estilo para Perfil na Tabela (Manter apenas OPERADOR, mas o CSS é bom) */
        .status.admin { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        .status.operador { background: rgba(30, 144, 255, 0.15); color: var(--accent); }
        .status.gestor { background: rgba(22, 163, 74, 0.15); color: var(--success); }
    </style>
</head>

<body>

<div class="app">
    <aside class="sidebar">
        <div class="brand">
            <div class="logo">LV</div>
            <div>
                <h1>Locação Veículos</h1>
                <div style="font-size:12px; color:var(--muted)">Gestão de Frota</div>
            </div>
        </div>

        <nav>
            <a class="nav-item" href="index.html">Dashboard</a>
            <a class="nav-item" href="frota.html">Marcas, Modelos & Categ.</a>
            <a class="nav-item" href="frota.html?tab=veiculo">Veículos</a>
            <a class="nav-item" href="locacao.html">Locações</a>
            <a class="nav-item" href="contrato.html">Contratos</a>
            <a class="nav-item" href="cliente.html">Clientes</a>
            <a class="nav-item active" href="usuario.html">Usuários</a>
            <a class="nav-item" href="relatorios.html">Relatórios</a>
        </nav>

        <div style="margin-top:auto; padding-top:20px; border-top:1px solid var(--glass); display:flex; justify-content:space-between; align-items:center">
            <span style="font-size:12px; color:var(--muted)" id="user-display">Usuário</span>

            <button id="themeToggle" class="icon-btn" title="Alternar Tema">
                <svg class="icon-sun" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                <svg class="icon-moon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>
        </div>
    </aside>

    <main class="main">
        <div class="topbar">
            <div class="search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity:0.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input id="globalSearch" placeholder="Buscar usuários por nome ou CPF...">
            </div>
            <button class="btn ghost" onclick="fazerLogout()" style="padding:6px 12px; font-size:12px;">Sair</button>
        </div>

        <section id="view-usuario" class="view">
            <div class="panel">
                <h2 id="title-usuario" style="margin-top:0; font-size:18px; margin-bottom:20px;">Cadastrar Usuário (Vendedor)</h2>
                <form id="form-usuario">
                    <input type="hidden" id="idUsuario">
                    <input type="hidden" id="idContato">
                    <input type="hidden" id="idEndereco">

                    <div class="full">
                        <label>Nome Completo</label>
                        <input id="nomeUsuario" class="input" placeholder="Ex: Maria da Silva">
                    </div>

                    <div>
                        <label>CPF</label>
                        <input id="cpfUsuario" class="input" placeholder="000.000.000-00">
                    </div>
                    <div>
                        <label>Login (Matrícula ou Apelido)</label>
                        <input id="loginUsuario" class="input" placeholder="login.maria">
                    </div>

                    <div>
                        <label>Senha</label>
                        <input id="senhaUsuario" type="password" class="input" placeholder="*******">
                    </div>

                    <div class="full" style="display:none;">
                        <input type="hidden" id="perfilUsuario" value="OPERADOR">
                    </div>

                    <div class="full"><h3 style="color:var(--muted); font-size:14px; margin-top:10px; margin-bottom:-10px;">Contato</h3></div>

                    <div>
                        <label>E-mail</label>
                        <input id="emailUsuario" type="email" class="input" placeholder="usuario@locadora.example">
                    </div>
                    <div>
                        <label>Celular</label>
                        <input id="celularUsuario" class="input" placeholder="(00) 00000-0000">
                    </div>

                    <div class="full"><h3 style="color:var(--muted); font-size:14px; margin-top:10px; margin-bottom:-10px;">Endereço</h3></div>

                    <div><label>Logradouro</label><input id="logradouroUsuario" class="input"></div>
                    <div><label>Número</label><input id="numeroUsuario" class="input"></div>


                    <div class="full" style="display:flex; justify-content:flex-end; gap:12px; margin-top:10px;">
                        <button type="button" class="btn btn-cancel" onclick="resetFormUsuario()">Cancelar Edição</button>
                        <button type="submit" class="btn" id="btn-submit-usuario">Salvar Usuário</button>
                    </div>
                </form>
            </div>

            <div class="panel" style="margin-top:20px">
                <h3 style="color:var(--muted)">Base de Usuários</h3>
                <table id="tabela-usuarios">
                    <thead><tr><th>ID</th><th>Nome</th><th>Login</th><th>CPF</th><th>E-mail</th><th>Ações</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<script>
    const API_URL = 'http://localhost:8080';
    let listaUsuarios = [];

    // --- 1. SEGURANÇA E LOGOUT ---

    // Verifica login
    const usuarioLogado = JSON.parse(localStorage.getItem('usuarioLogado'));
    if (!usuarioLogado) {
        window.location.href = 'login.html';
    } else {
        document.getElementById('user-display').innerText = usuarioLogado.nome ? usuarioLogado.nome.split(' ')[0] : 'Usuário';
    }

    function fazerLogout() {
        if(confirm("Tem certeza que deseja sair do sistema?")) {
            localStorage.removeItem('usuarioLogado');
            window.location.href = 'login.html';
        }
    }

    // --- 2. INICIALIZAÇÃO ---
    async function init() {
        document.getElementById('themeToggle').addEventListener('click', () => {
            document.body.classList.toggle('light');
        });

        setupSearch();
        carregarTabelaUsuarios();
    }

    // --- 3. USUÁRIOS (CRUD) ---
    async function carregarTabelaUsuarios() {
        try {
            const resp = await fetch(`${API_URL}/usuarios`);
            listaUsuarios = await resp.json();
            renderTabelaUsuarios(listaUsuarios);
        } catch (e) {
            console.error("Erro ao carregar usuários. Verifique o UsuarioController.", e);
        }
    }

    function renderTabelaUsuarios(dados) {
        const tbody = document.querySelector('#tabela-usuarios tbody');
        tbody.innerHTML = '';
        if(dados.length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="no-results">Nenhum usuário encontrado.</td></tr>'; return; }

        dados.forEach(u => {
            tbody.innerHTML += `
                <tr>
                    <td>${u.id}</td>
                    <td>${u.nome}</td>
                    <td>${u.login || '-'}</td>
                    <td>${u.cpf || '-'}</td>
                    <td>${u.contato?.email || '-'}</td>
                    <td style="display:flex; gap:10px;">
                        <button class="btn ghost" onclick="prepararEdicaoUsuario(${u.id})" style="color:var(--accent); border-color:var(--accent); padding:4px 8px; font-size:12px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></button>
                        <button class="btn ghost" onclick="deletarUsuario(${u.id})" style="color:var(--danger); border-color:var(--danger); padding:4px 8px; font-size:12px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
                    </td>
                </tr>`;
        });
    }

    // Prepara formulário para Edição
    window.prepararEdicaoUsuario = function(id) {
        const u = listaUsuarios.find(u => u.id == id);
        if(!u) return alert('Usuário não encontrado.');

        // 1. DADOS PRINCIPAIS
        document.getElementById('idUsuario').value = u.id;
        document.getElementById('nomeUsuario').value = u.nome;
        document.getElementById('cpfUsuario').value = u.cpf || '';
        document.getElementById('loginUsuario').value = u.login || '';
        document.getElementById('perfilUsuario').value = u.perfil || 'OPERADOR';

        // 2. DADOS DE CONTATO
        if(u.contato) {
            document.getElementById('idContato').value = u.contato.id;
            document.getElementById('emailUsuario').value = u.contato.email || '';
            document.getElementById('celularUsuario').value = u.contato.celular || '';
        } else {
             document.getElementById('idContato').value = '';
             document.getElementById('emailUsuario').value = '';
             document.getElementById('celularUsuario').value = '';
        }

        // 3. DADOS DE ENDEREÇO
        if(u.endereco) {
            document.getElementById('idEndereco').value = u.endereco.id;
            document.getElementById('logradouroUsuario').value = u.endereco.logradouro || '';
            document.getElementById('numeroUsuario').value = u.endereco.numero || '';
        } else {
             document.getElementById('idEndereco').value = '';
             document.getElementById('logradouroUsuario').value = '';
             document.getElementById('numeroUsuario').value = '';
        }

        // 4. Mudar UX (Senha não é preenchida)
        document.getElementById('senhaUsuario').value = '';
        document.getElementById('senhaUsuario').placeholder = 'Deixe vazio para manter a senha atual';
        document.getElementById('title-usuario').innerText = `Alterar Usuário (ID: ${u.id})`;
        document.getElementById('btn-submit-usuario').innerText = 'Atualizar Usuário';
        document.querySelector('#form-usuario .btn-cancel').style.display = 'inline-flex';
    }

    // Reseta o formulário
    window.resetFormUsuario = function() {
        document.getElementById('form-usuario').reset();
        document.getElementById('idUsuario').value = '';
        document.getElementById('idContato').value = '';
        document.getElementById('idEndereco').value = '';

        document.getElementById('senhaUsuario').placeholder = '*******';

        document.getElementById('title-usuario').innerText = 'Cadastrar Usuário';
        document.getElementById('btn-submit-usuario').innerText = 'Salvar Usuário';
        document.querySelector('#form-usuario .btn-cancel').style.display = 'none';
    }

    // Submissão do Formulário (Salvar/Atualizar)
    const formUsuario = document.getElementById('form-usuario');
    if(formUsuario) {
        formUsuario.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('idUsuario').value;
            const isUpdate = !!id;

            // 1. Monta Contato
            const contato = {
                id: document.getElementById('idContato').value || null,
                email: document.getElementById('emailUsuario').value,
                celular: document.getElementById('celularUsuario').value,
                telefone: document.getElementById('celularUsuario').value,
            };

            // 2. Monta Endereço
            const endereco = {
                id: document.getElementById('idEndereco').value || null,
                logradouro: document.getElementById('logradouroUsuario').value,
                numero: document.getElementById('numeroUsuario').value,
                cep: '',
                complemento: '',
                referencia: '',
            };

            // 3. Monta o objeto Usuário
            const payload = {
                id: id || null,
                nome: document.getElementById('nomeUsuario').value,
                cpf: document.getElementById('cpfUsuario').value,
                login: document.getElementById('loginUsuario').value,
                senha: document.getElementById('senhaUsuario').value,
                perfil: document.getElementById('perfilUsuario').value,
                contato: contato,
                endereco: endereco
            };

            if (isUpdate && payload.senha === '') {
                delete payload.senha;
            }

            try {
                const resp = await fetch(`${API_URL}/usuarios`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if(resp.ok) {
                    alert(isUpdate ? 'Usuário atualizado!' : 'Usuário salvo!');
                    resetFormUsuario();
                    carregarTabelaUsuarios();
                } else {
                    alert('Erro ao salvar/atualizar usuário. Verifique o console ou se o login já existe.');
                    console.error("Erro do Servidor:", await resp.text());
                }
            } catch (e) {
                console.error("Erro de conexão:", e);
            }
        });
    }

    // Deletar Usuário
    window.deletarUsuario = async function(id) {
        if(confirm('Tem certeza? Isso pode impedir que contratos assinados por este usuário sejam referenciados.')) {
            try {
                await fetch(`${API_URL}/usuarios/${id}`, { method: 'DELETE' });
                carregarTabelaUsuarios();
            }
            catch (e) {
                alert('Erro ao excluir (pode haver contratos ou dependências ativas).');
            }
        }
    }

    // --- 4. BUSCA GLOBAL ---
    function setupSearch() {
        const input = document.getElementById('globalSearch');
        input.addEventListener('keyup', (e) => {
            const termo = e.target.value.toLowerCase();
            const filtrado = listaUsuarios.filter(u =>
                u.nome.toLowerCase().includes(termo) ||
                (u.login && u.login.toLowerCase().includes(termo)) ||
                (u.email && u.email.toLowerCase().includes(termo)) ||
                (u.cpf && u.cpf.includes(termo))
            );
            renderTabelaUsuarios(filtrado);
        });
    }

    // --- START ---
    init();
</script>

</body>
</html>
