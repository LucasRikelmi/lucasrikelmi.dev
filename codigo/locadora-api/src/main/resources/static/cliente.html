<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Gestão de Pessoas — Clientes</title>
    <link rel="stylesheet" href="global.css">
    <style>
        /* CORREÇÃO VISUAL EXCLUSIVA DO CLIENTE */
        /* Garante que o texto dos inputs relacionados a Endereço/Contato tenha a cor correta */
        #view-cliente input:not([type="hidden"]),
        #view-cliente select {
            color: inherit; /* Herda a cor do tema, resolvendo o problema no modo escuro */
        }
    </style>
</head>

<body>

<div class="app">
    <aside class="sidebar">
        <div class="brand">
            <div class="logo">LV</div>
            <div>
                <h1>Locação Veículos</h1>
                <div style="font-size:12px; color:var(--muted)">Gestão de Frota</div>
            </div>
        </div>

        <nav>
            <a class="nav-item" href="index.html">Dashboard</a>
            <a class="nav-item" href="frota.html">Marcas, Modelos & Categ.</a>
            <a class="nav-item" href="frota.html?tab=veiculo">Veículos</a>
            <a class="nav-item" href="locacao.html">Locações</a>
            <a class="nav-item" href="contrato.html">Contratos</a>
            <a class="nav-item active" href="cliente.html">Clientes</a> <a class="nav-item" href="usuario.html">Usuários</a>
            <a class="nav-item" href="relatorios.html">Relatórios</a>
        </nav>

        <div style="margin-top:auto; padding-top:20px; border-top:1px solid var(--glass); display:flex; justify-content:space-between; align-items:center">
            <span style="font-size:12px; color:var(--muted)" id="user-display">Usuário</span>

            <button id="themeToggle" class="icon-btn" title="Alternar Tema">
                <svg class="icon-sun" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                <svg class="icon-moon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>
        </div>
    </aside>

    <main class="main">
        <div class="topbar">
            <div class="search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity:0.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input id="globalSearch" placeholder="Buscar clientes por nome ou CPF...">
            </div>
            <button class="btn ghost" onclick="fazerLogout()" style="padding:6px 12px; font-size:12px;">Sair</button>
        </div>

        <section id="view-cliente" class="view">
            <div class="panel">
                <h2 id="title-cliente" style="margin-top:0; font-size:18px; margin-bottom:20px;">Cadastrar Cliente</h2>
                <form id="form-cliente">
                    <input type="hidden" id="idCliente">
                    <input type="hidden" id="idContato">
                    <input type="hidden" id="idEndereco">

                    <div class="full">
                        <label>Nome Completo</label>
                        <input id="nomeCliente" class="input" placeholder="Ex: Ana Souza">
                    </div>

                    <div>
                        <label>CPF</label>
                        <input id="cpfCliente" class="input" placeholder="000.000.000-00">
                    </div>
                    <div>
                        <label>CNH</label>
                        <input id="cnhCliente" class="input" placeholder="00000000000">
                    </div>

                    <div class="full"><h3 style="color:var(--muted); font-size:14px; margin-top:10px; margin-bottom:-10px;">Contato</h3></div>

                    <div>
                        <label>E-mail</label>
                        <input id="emailCliente" type="email" class="input" placeholder="cliente@email.com">
                    </div>
                    <div>
                        <label>Celular</label>
                        <input id="celularCliente" class="input" placeholder="(00) 00000-0000">
                    </div>

                    <div class="full"><h3 style="color:var(--muted); font-size:14px; margin-top:10px; margin-bottom:-10px;">Endereço</h3></div>

                    <div><label>Logradouro</label><input id="logradouroCliente" class="input"></div>
                    <div><label>Número</label><input id="numeroCliente" class="input"></div>
                    <div><label>CEP</label><input id="cepCliente" class="input"></div>
                    <div><label>Complemento/Ref.</label><input id="complementoCliente" class="input"></div>


                    <div class="full" style="display:flex; justify-content:flex-end; gap:12px; margin-top:10px;">
                        <button type="button" class="btn btn-cancel" onclick="resetFormCliente()">Cancelar Edição</button>
                        <button type="submit" class="btn" id="btn-submit-cliente">Salvar Cliente</button>
                    </div>
                </form>
            </div>

            <div class="panel" style="margin-top:20px">
                <h3 style="color:var(--muted)">Base de Clientes</h3>
                <table id="tabela-clientes">
                    <thead><tr><th>ID</th><th>Nome</th><th>CPF</th><th>CNH</th><th>Celular</th><th>Ações</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<script>
    const API_URL = 'http://localhost:8080';
    let listaClientes = [];

    // --- 1. INICIALIZAÇÃO E SEGURANÇA ---

    // Verifica login
    const usuarioLogado = JSON.parse(localStorage.getItem('usuarioLogado'));
    if (!usuarioLogado) {
        window.location.href = 'login.html';
    } else {
        document.getElementById('user-display').innerText = usuarioLogado.nome ? usuarioLogado.nome.split(' ')[0] : 'Usuário';
    }

    // Função Logout
    function fazerLogout() {
        if(confirm("Tem certeza que deseja sair do sistema?")) {
            localStorage.removeItem('usuarioLogado');
            window.location.href = 'login.html';
        }
    }

    async function init() {
        // Lógica de tema
        document.getElementById('themeToggle').addEventListener('click', () => {
            document.body.classList.toggle('light');
        });

        setupSearch();
        carregarTabelaClientes();
    }

    // --- 2. CLIENTES (CRUD) ---
    async function carregarTabelaClientes() {
        try {
            const resp = await fetch(`${API_URL}/clientes`);
            listaClientes = await resp.json();
            renderTabelaClientes(listaClientes);
        } catch (e) {
            console.error("Erro ao carregar clientes. Verifique o ClienteController.", e);
        }
    }

    function renderTabelaClientes(dados) {
        const tbody = document.querySelector('#tabela-clientes tbody');
        tbody.innerHTML = '';
        if(dados.length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="no-results">Nenhum cliente encontrado.</td></tr>'; return; }

        dados.forEach(c => {
            const celular = c.contato ? c.contato.celular : '-';

            tbody.innerHTML += `
                <tr>
                    <td>${c.id}</td>
                    <td>${c.nome}</td>
                    <td>${c.cpf || '-'}</td>
                    <td>${c.cnh || '-'}</td>
                    <td>${celular}</td>
                    <td style="display:flex; gap:10px;">
                        <button class="btn ghost" onclick="prepararEdicaoCliente(${c.id})" style="color:var(--accent); border-color:var(--accent); padding:4px 8px; font-size:12px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></button>
                        <button class="btn ghost" onclick="deletarCliente(${c.id})" style="color:var(--danger); border-color:var(--danger); padding:4px 8px; font-size:12px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
                    </td>
                </tr>`;
        });
    }

    // Prepara formulário para Edição
    window.prepararEdicaoCliente = function(id) {
        const cliente = listaClientes.find(c => c.id == id);
        if(!cliente) return alert('Cliente não encontrado.');

        // --- 1. DADOS PRINCIPAIS ---
        document.getElementById('idCliente').value = cliente.id;
        document.getElementById('nomeCliente').value = cliente.nome;
        document.getElementById('cpfCliente').value = cliente.cpf || '';
        document.getElementById('cnhCliente').value = cliente.cnh || '';

        // --- 2. DADOS DE CONTATO ---
        if(cliente.contato) {
            document.getElementById('idContato').value = cliente.contato.id;
            document.getElementById('emailCliente').value = cliente.contato.email || '';
            document.getElementById('celularCliente').value = cliente.contato.celular || '';
        } else {
            document.getElementById('idContato').value = '';
            document.getElementById('emailCliente').value = '';
            document.getElementById('celularCliente').value = '';
        }

        // --- 3. DADOS DE ENDEREÇO ---
        if(cliente.endereco) {
            document.getElementById('idEndereco').value = cliente.endereco.id;
            document.getElementById('logradouroCliente').value = cliente.endereco.logradouro || '';
            document.getElementById('numeroCliente').value = cliente.endereco.numero || '';
            document.getElementById('cepCliente').value = cliente.endereco.cep || '';
            document.getElementById('complementoCliente').value = cliente.endereco.complemento || cliente.endereco.referencia || '';
        } else {
            document.getElementById('idEndereco').value = '';
            document.getElementById('logradouroCliente').value = '';
            document.getElementById('numeroCliente').value = '';
            document.getElementById('cepCliente').value = '';
            document.getElementById('complementoCliente').value = '';
        }

        // --- 4. Mudar UX ---
        document.getElementById('title-cliente').innerText = `Alterar Cliente (ID: ${cliente.id})`;
        document.getElementById('btn-submit-cliente').innerText = 'Atualizar Cliente';
        document.querySelector('#form-cliente .btn-cancel').style.display = 'inline-flex';
    }

    // Reseta o formulário
    window.resetFormCliente = function() {
        document.getElementById('form-cliente').reset();
        document.getElementById('idCliente').value = '';
        document.getElementById('idContato').value = '';
        document.getElementById('idEndereco').value = '';

        document.getElementById('title-cliente').innerText = 'Cadastrar Cliente';
        document.getElementById('btn-submit-cliente').innerText = 'Salvar Cliente';
        document.querySelector('#form-cliente .btn-cancel').style.display = 'none';
    }

    // Submissão do Formulário (Salvar/Atualizar)
    const formCliente = document.getElementById('form-cliente');
    if(formCliente) {
        formCliente.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('idCliente').value;
            const isUpdate = !!id;

            // Monta o objeto Endereço
            const endereco = {
                id: document.getElementById('idEndereco').value || null,
                logradouro: document.getElementById('logradouroCliente').value,
                numero: document.getElementById('numeroCliente').value,
                cep: document.getElementById('cepCliente').value,
                complemento: document.getElementById('complementoCliente').value,
                referencia: document.getElementById('complementoCliente').value,
            };

            // Monta o objeto Contato
            const contato = {
                id: document.getElementById('idContato').value || null,
                email: document.getElementById('emailCliente').value,
                celular: document.getElementById('celularCliente').value,
                telefone: document.getElementById('celularCliente').value,
            };

            // Monta o objeto Cliente
            const payload = {
                id: id || null,
                nome: document.getElementById('nomeCliente').value,
                cpf: document.getElementById('cpfCliente').value,
                cnh: document.getElementById('cnhCliente').value,
                contato: contato,
                endereco: endereco,
            };

            try {
                const resp = await fetch(`${API_URL}/clientes`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if(resp.ok) {
                    alert(isUpdate ? 'Cliente atualizado!' : 'Cliente salvo!');
                    resetFormCliente();
                    carregarTabelaClientes();
                } else {
                    alert('Erro ao salvar/atualizar cliente. Verifique o console.');
                    console.error("Erro do Servidor:", await resp.text());
                }
            } catch (e) {
                console.error("Erro de conexão:", e);
            }
        });
    }

    // Deletar Cliente
    window.deletarCliente = async function(id) {
        if(confirm('Tem certeza? Isso pode invalidar Contratos e Locações.')) {
            try {
                await fetch(`${API_URL}/clientes/${id}`, { method: 'DELETE' });
                carregarTabelaClientes();
            }
            catch (e) {
                alert('Erro ao excluir (pode haver contratos ou dependências ativas).');
            }
        }
    }

    // --- 3. BUSCA GLOBAL ---
    function setupSearch() {
        const input = document.getElementById('globalSearch');
        input.addEventListener('keyup', (e) => {
            const termo = e.target.value.toLowerCase();
            const filtrado = listaClientes.filter(c =>
                c.nome.toLowerCase().includes(termo) ||
                (c.cpf && c.cpf.includes(termo)) ||
                (c.contato && c.contato.celular && c.contato.celular.includes(termo))
            );
            renderTabelaClientes(filtrado);
        });
    }

    // --- START ---
    init();
</script>

</body>
</html>
